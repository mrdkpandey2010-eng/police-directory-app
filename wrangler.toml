name = "police-directory-r2-api"
main = "cloudflare-worker/worker.js"
compatibility_date = "2024-04-01"

# Cloudflare R2 Bucket Binding
# Replace "police-directory-bucket" with your actual R2 bucket name
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "police-directory-bucket"

[vars]
ADMIN_API_KEY = "police_admin_2026"
